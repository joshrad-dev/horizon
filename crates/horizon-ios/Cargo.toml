[package]
name = "horizon-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Horizon on iOS and iPadOS: the app's executable (Metal, touch controls)"
publish = false

[[bin]]
name = "horizon-ios"
path = "src/main.rs"

[dependencies]
horizon-client = { path = "../horizon-client", default-features = false, features = ["audio"] }
horizon-threads = { path = "../horizon-threads" }
horizon-mods = { path = "../horizon-mods", default-features = false, features = ["index"] }
horizon-client-input = { path = "../horizon-client-input" }
winit = "0.30.13"
# The packed resources (prepared_files.rs) and the languages fetched when picked (languages.rs).
horizon-core = { path = "../horizon-core" }
log = "0.4"
serde_json = "1"
sha1 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(target_os = "ios")'.dependencies]
# UIKit's reserved regions (iPhone Duo's fold) and the device idiom, by message: the versions
# winit already uses.
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

[lints]
workspace = true
